
name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dbtestgen_runner
          POSTGRES_PASSWORD: runner_ci_only_password
          POSTGRES_DB: dbtestgen
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U dbtestgen_runner -d dbtestgen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DBTESTGEN_POSTGRES_URL: postgresql://dbtestgen_runner:runner_ci_only_password@127.0.0.1:5433/dbtestgen

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize PostgreSQL test schema
        run: |
          python -c "import os, psycopg; c=psycopg.connect(os.environ['DBTESTGEN_POSTGRES_URL']); c.execute('CREATE SCHEMA IF NOT EXISTS dbtestgen_sandbox'); c.commit(); c.close()"

      - name: Run automated tests
        run: python -m pytest tests -q
